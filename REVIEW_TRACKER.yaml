pr_plan:
  policy: >
    Docs: catch-up pass in PR-01 to remove wrong content, docs-as-we-go in each
    code PR, final authoritative sweep in PR-11 after all code PRs merge.
  pr_workflow:
    - "Push the PR branch to origin"
    - "Post the PR-create link + description notes for the user to open the PR"
    - "User creates/merges the PR on GitHub"
    - "Before next PR: checkout master, pull latest, delete merged local branch"
    - "Verify clean baseline (build 0/0, tests green) before branching next PR"
  PR-01-docs-catchup:
    gate: none
    findings: [CR-004, HP-006, MP-023]
    note: "Strip references to removed Kaleido.AspNetCore + obsolete APIs; minimal corrections only — full rewrite deferred to PR-11"
  PR-02-breaking-surface:
    gate: none
    findings: [HP-005, HP-015, MP-016, MP-021]
    note: "All renames/typos in ONE PR — break once"
  PR-03-runtime-correctness:
    gate: none
    findings: [CR-007, EXT-03, HP-014, MP-009]
  PR-04-dead-code-dedup:
    gate: none
    findings: [MP-007, MP-020, MP-013, MP-018, MP-005, MP-026]
