critical_decisions:
  CR-001:
    title: HTTP Abstractions Project Layering
    description: Clarify whether HTTP Abstractions should support multi-transport or remain single-transport
    decision_required_by: 2026-09-28
    v2_status: DE-SCOPED
    v2_note: >
      src/AGENTS.md already documents the multi-transport rule (one project per transport).
      Real boundary leaks are small: KaleidoClientOptions in core (HP-011),
      ProcessResponseFactory in contracts (MP-013), KaleidoHttpTelemetry coupling (LP-010).
      Fix leaks instead of splitting; Q-001 stays open as product input, non-blocking.
    options:
      - name: "Fix boundary leaks only (RECOMMENDED)"
        description: Move KaleidoClientOptions, ProcessResponseFactory, split KaleidoHttpTelemetry
        complexity: medium
        effort_days: 1-2
        breaking_change: true
      - name: "Option A: Multi-Transport split"
        description: Split into Kaleido.Transport.Abstractions and HTTP-specific
        complexity: large
        effort_days: 3-5
        breaking_change: true
      - name: "Option C: Status Quo + Documentation"
        complexity: small
        effort_days: 2
        breaking_change: false
    assigned_to: null
    status: PENDING_DECISION

  CR-002:
    title: Build Hardening for Release
    description: Implement lock files, pack step, coverage gate, warnings-as-errors scope
    decision_required_by: 2026-09-28
    v2_status: PARTIALLY_INCORRECT
    v2_note: >
      Source Link, snupkg, symbols, XML docs, deterministic builds ARE configured
      (src/Directory.Build.props). Real gaps: no packages.lock.json/locked restore,
      no dotnet pack/release job, no coverage gate, TreatWarningsAsErrors only in src/.
      See MP-024 for the corrected checklist.
    complexity: small
    effort_days: 2-3
    breaking_change: false
    assigned_to: null
    status: PENDING_DECISION

  CR-003:
    title: Versioning & Release Strategy
    description: Document SemVer policy, deprecation windows, breaking change process, release checklist
    v2_note: >
      CONFIRMED with evidence: Version/PackageVersion hard-coded 1.0.0 in
      src/Directory.Build.props:5-6; no GitVersion/NBGV; no CI version input.
      Recommend NBGV version.json or CI-driven -p:PackageVersion.
    decision_required_by: 2026-09-28
    complexity: small
    effort_days: 1-2
    breaking_change: false
    assigned_to: null
    status: PENDING_DECISION

  CR-004:
    title: Root docs describe removed Kaleido.AspNetCore; quickstart does not compile
    description: >
      Purge Kaleido.AspNetCore from README/ARCHITECTURE/src docs; rewrite bootstrap
      samples to AddKaleido(config, o => o.Assemblies) + AddHttp() + Map*;
      delete stale src/Core and src/Kaleido.AspNetCore artifact dirs.
    severity: CRITICAL
    effort_days: 1-2
    breaking_change: false
    release_blocker: true
    status: IN_PROGRESS
    progress_note: >
      PR-01 (merged #18): Kaleido.AspNetCore purged from all live docs; quickstart
      now uses AddHttp() and compiles. Remaining: final authoritative sweep PR-11;
      stale dir deletion is MP-022 (PR-05).

  CR-005:
    title: ExceptionMiddleware exception-to-response contract untested
    description: Theory matrix exception -> status + KaleidoErrorResponse body; functional 500-shape test
    severity: CRITICAL
    effort_days: 0.5-1
    breaking_change: false
    release_blocker: true
    status: PENDING_IMPLEMENTATION

  CR-006:
    title: ObservabilityMiddleware correlation read/populate/echo untested
    description: Unit tests for context population + response header echo + Activity tagging; functional header assertion
    severity: CRITICAL
    effort_days: 1-2
    breaking_change: false
    release_blocker: true
    status: PENDING_IMPLEMENTATION

  CR-007:
    title: Duplicate cancellation signal in ProcessRuntime + unguarded OCE invariant
    description: >
      Remove Canceled() at ProcessRuntime.cs:246-250 (ProcessExecutor is the single
      recording point per AGENTS.md). Add tests: OCE propagates, Canceled() once,
      *Failed never — per engine/invoker/runtime.
    severity: CRITICAL
    effort_days: 1-2
    breaking_change: false
    release_blocker: true
    status: PENDING_IMPLEMENTATION

