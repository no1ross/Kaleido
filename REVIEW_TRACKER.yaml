open_questions:
  Q-001:
    question: "Should Kaleido support non-HTTP transports (gRPC, messaging) in the future?"
    context: "CR-001 de-scoped to boundary-leak fixes; still informs depth of decoupling"
    due: 2026-09-28
    impact: MEDIUM
  Q-002:
    question: "Are there real-world use cases for IEventPublisher consumers?"
    context: "HP-001 + HP-009 enforcement decision"
    due: 2026-09-28
    impact: HIGH
  Q-003:
    question: "Is MapRegistry always-200-with-ClientErrors contract deliberate?"
    context: "MP-026 — consider strict mode or Partial flag"
    due: 2026-09-29
    impact: MEDIUM
  Q-004:
    question: "Should SutFixture be adopted broadly or retired?"
    context: "MP-017 — analyzers enforce a convention ~2 test classes follow"
    due: 2026-09-29
    impact: MEDIUM
  Q-005:
    question: "Remove the Assemblies calling-assembly fallback entirely?"
    context: "HP-012 — determinism vs convenience"
    due: 2026-09-28
    impact: HIGH

  Q-006:
    question: "Analyzer disposition: keep DI-hygiene suite (v2) or prune to correctness-only rules (external reviews)?"
    context: "MP-017 — external reviews recommend deleting KAL0003/0015/KAL1001-1004/1006-1009; v2 recommends keeping the suite"
    due: 2026-09-29
    impact: MEDIUM

  Q-007:
    question: "Scope of EXT-01/EXT-02 for 1.0: full CAS+outbox implementation or contract-design-now/implement-later?"
    context: "External merge — the largest architectural decision in the review set"
    due: 2026-09-28
    impact: CRITICAL
    decision: "Best-effort for 1.0. Outbox is a consumer infrastructure concern. Framework wraps publish in try/catch and logs Warning on failure. Full transactional outbox deferred to post-1.0."
    status: RESOLVED

  Q-008:
    question: "Ship a consumer analyzer package (KAL2xxx) or keep analyzers repo-only?"
    context: "EXT-05 — Kaleido.Analyzers is packable but contains zero rules (verified)"
    due: 2026-09-29
    impact: MEDIUM

  Q-009:
    question: "Information Request (AI-015): what is the shape and scope of the first-class 'process needs information' concept?"
    context: >
      Strategic direction for AI-native positioning. Decisions needed:
      (a) naming — InformationRequest vs InformationCollection (not 'Questionnaire');
      (b) new AwaitingInformation state vs enriching AwaitingRequiredStep with a descriptor;
      (c) static (attribute/field-metadata-derived) vs dynamic (handler-supplied) questions — or both, with override rules;
      (d) answer submission — reuse the ResponseStep's execute endpoint vs a dedicated submit-information endpoint;
      (e) partial/progressive answers — can a consumer answer a subset and get the next question?;
      (f) persistence on ProcessorContext and IProcessContextStore contract impact;
      (g) scope for 1.0 — design + additive contract now vs fully post-1.0;
      (h) whether NeedsApproval / NeedsHumanReview / NeedsDocument share one generic 'awaiting' descriptor or get distinct types.
    due: null
    impact: HIGH

