consumer_analyzer_candidates:
  status: PLANNED
  trigger: "sample updates + KAL2xxx disposition (Q-008); rules driven by what consumers actually write"
  rules:
    - name: "step-name literal validation"
      detail: "warn when a literal step name passed to client.ExecuteStepAsync matches no [ProcessStep].Name in the compilation's referenced assemblies; include available names in the message"
    - name: "ProcessStep suffix convention"
      detail: "warn when a [ProcessStep]-annotated class does not end in 'Step' -- required for the typeName-'Step' derivation convention"
    - name: "convention-divergent explicit Name"
      detail: "info when explicit [ProcessStep].Name differs from the derived convention -- consumer mirror types must carry the attribute to resolve it"

