# ──────────────────────────────────────────────────────────────────────────────
# AI Compatibility Findings  (added post-v2.1)
# Source: owner assessment — "Kaleido as AI capability substrate"
# ──────────────────────────────────────────────────────────────────────────────
ai_compatibility:
  summary: >
    Kaleido is a credible AI capability-discovery substrate. Its metadata-first
    design, typed contracts, explicit processId state handle, and machine-readable
    registries are unusually well suited to AI tool discovery. It is NOT yet
    suitable for autonomous-agent use without a safety/policy layer. The items
    below track what is needed before "AI-compatible" positioning is fully honest
    and before "AI-native" or "safe for autonomous agents" could be claimed.

  release_position:
    public_source_repo: "YES — clearly labelled experimental/preview"
    prerelease_nuget: "YES — after build/package validation from a complete checkout"
    stable_1_0: "NO"
    ai_compatible_positioning: "YES"
    ai_native_or_autonomous_agent_safe: "NOT YET"

  strengths:
    - Unified registry combines local + downstream Process and Queryable registrations
    - Step metadata exposes name, version, description, input types, constraints, dependencies, availability, output types, and execution URL
    - Queryable metadata exposes context, view, paging limits, output fields, and query URLs
    - Explicit processId state handle aligns with MCP/tool-protocol state-handle pattern
    - Functional tests verify dependency, output metadata, and generated URLs

  ai_findings:
    AI-001:
      title: No behavioral safety metadata on capabilities
      severity: HIGH
      category: API design / AI safety
      description: >
        Step and view metadata expose structural schema (inputs, outputs, constraints)
        but no behavioral declarations: read-only vs state-changing, destructive,
        idempotent, requires-confirmation, required-auth-scopes, expected-cost,
        data-sensitivity-classification, retry policy. An AI system cannot make
        safe autonomous decisions about whether to call an operation based solely
        on structural metadata. Note: Repeatable != idempotent — a repeatable step
        may charge a card, send a message, or create another record.
      recommended_fix: >
        Add a CapabilityPolicy / StepBehavior annotation bag to ProcessStepMetadata
        and QueryViewMetadata. Fields: ReadOnly, HasSideEffects, Destructive,
        Idempotent, RequiresConfirmation, DataClassification, TimeoutGuidance,
        RetryGuidance. Emit into registry/metadata endpoints. No model-provider
        coupling — keep runtime neutral; adapters consume the policy bag.
      effort: medium
      breaking_change: additive
      status: PENDING_DESIGN_REVIEW

    AI-002:
      title: No optimistic concurrency / durable idempotency on process state
      severity: CRITICAL
      category: Correctness / AI safety
      description: >
        AI agents and tool hosts commonly retry after timeouts, transport failures,
        or ambiguous results. The current process-store contract does not provide
        optimistic concurrency or durable idempotency keys. Two concurrent calls
        can plan against the same state and overwrite each other; a retried call
        can repeat a business side effect. This is important for all clients;
        it is especially dangerous for probabilistic callers that may issue
        duplicate, concurrent, or recovery calls. Relates to EXT-01/EXT-02.
      recommended_fix: >
        Optimistic concurrency token on ProcessorContext. Idempotency-key support
        on every state-changing endpoint (store key + result, replay on duplicate).
        IProcessContextStore contract extension. Covered by Q-007 decision scope.
      effort: large
      breaking_change: true
      status: PENDING_DESIGN_REVIEW
      related: [EXT-01, EXT-02, Q-007]

    AI-003:
      title: Discovery freshness is ambiguous — no TTL, ETag, or generated-at timestamp
      severity: MEDIUM
      category: API design / correctness
      description: >
        Server registry has no explicit TTL, ETag, generated-at timestamp, or
        freshness version. Clients retain registry data until manually invalidated.
        Partial aggregated responses return HTTP 200 with degradation in the body.
        An AI system cannot know whether its registry snapshot is current, whether
        some services are missing from the snapshot, whether the discovered URL
        belongs to an older deployment, or whether it should refresh before invoking
        a tool.
      recommended_fix: >
        Add RegistryRevision (monotonic or hash) and GeneratedAt to all registry
        and catalog responses. Add ETag + Cache-Control to registry endpoints.
        Consider a Freshness-Required header that triggers a re-fetch rather than
        proceeding on stale data. Partial aggregated responses should include a
        DegradedServices list.
      effort: small
      breaking_change: additive
      status: COMPLETED
      progress_note: >
        (PR-13) AggregatedRegistryResponse now carries GeneratedAt, Revision
        (SHA-256 of the per-caller filtered payload), and IsPartial. The
        endpoint emits ETag + Cache-Control and honors If-None-Match -> 304.
        ClientErrors is the DegradedServices equivalent; ?strict returns 502
        (full body included) when partial. FreshnessRequired->stale blocking is
        covered by ?refresh + client Kaleido:RegistryTtl instead of a new header.

    AI-004:
      title: Authorization is possible but not the easy default — registry leaks all capabilities
      severity: HIGH
      category: Security / API design
      description: >
        Endpoint discovery exposes all registered capabilities regardless of the
        caller's authorization. Resolved EXT-07 (MapKaleido returns IEndpointConventionBuilder)
        makes auth application easier, but the registry still returns every operation
        to every caller. MCP guidance allows discoverable tool sets to vary according
        to request authorization. An AI client should receive only what it is
        permitted to invoke — capability leakage raises both security and prompt-
        injection surface concerns.
      recommended_fix: >
        Authorization-aware registry filtering: optional ICapabilityFilter contract
        consulted at discovery time, injected from HttpContext claims. Allow explicit
        include/exclude lists per service. Require auth integration tests (401/403).
      effort: medium
      breaking_change: possibly
      status: MERGED
      merged_into: EXT-12
      related: [EXT-07]

    AI-005:
      title: Default event payloads too expansive for AI-oriented workloads
      severity: HIGH
      category: Privacy / security
      description: >
        EXT-04 documents that events carry full process requests/responses and
        full query result sets with no redaction, field classification, or size cap.
        This is especially dangerous for AI workloads: if an AI queries personal,
        medical, financial, or confidential information, duplicating the complete
        result into audit/event infrastructure materially expands the regulatory
        data footprint. EXT-04 was closed as document-only for 1.0 — that decision
        should be revisited before AI-compatible positioning is published.
      recommended_fix: >
        Metadata-only event default + explicit opt-in payload policy, redaction
        hooks, payload size cap. Tests proving sensitive values never appear in
        default events, logs, or OTel tags. Consider this a blocker for AI positioning.
      effort: large
      breaking_change: true
      status: PENDING_DESIGN_REVIEW
      related: [EXT-04]

    AI-006:
      title: No canonical AI-tool adapter layer
      severity: LOW
      category: API design / extensibility
      description: >
        Kaleido's protocol-neutral metadata is a strength. The recommended
        architecture is a thin optional adapter: Kaleido runtime → canonical
        capability manifest → OpenAPI/MCP/other AI-tool adapters. No such adapter
        or canonical manifest contract currently exists. Queryable contexts/views
        would become read tools; Process steps would become action tools; processId
        would be the explicit state handle.
      recommended_fix: >
        Define a CapabilityManifest record (CapabilityId, Kind, Name, Version,
        Description, InputSchema, OutputSchema, + policy bag from AI-001,
        RegistryRevision, GeneratedAt). Publish a Kaleido.Adapters.OpenApi or
        Kaleido.Adapters.Mcp package as a separate opt-in concern. Core runtime
        stays neutral.
      effort: medium
      breaking_change: false
      status: DEFERRED_POST_1_0

    AI-007:
      title: Practical AI adoption sequence
      severity: INFO
      category: Guidance
      description: >
        The recommended safe introduction order for AI use:
        1. Allowlisted read-only Queryable operations, supervised, authenticated, bounded, auditable.
        2. Add canonical capability manifest + AI-tool adapter (AI-006).
        3. Expose low-risk idempotent Process steps with confirmation.
        4. Introduce InformationRequest (AI-015) so processes drive the conversation;
           migrate the PriorAuth sample as the reference.
        5. Permit consequential Process actions only after AI-002 (concurrency/idempotency),
           AI-004 (auth-aware discovery), AI-005 (event redaction), and AI-001 (safety metadata).
        AI-015 design may proceed in parallel with 1–3; only autonomous-agent exposure is gated on 5.
      effort: N/A
      breaking_change: false
      status: GUIDANCE

    AI-015:
      title: Information Request is not a first-class Process concept
      severity: HIGH
      priority_note: STRATEGIC — the differentiator for AI-native positioning
      category: API design / AI-native capability
      description: >
        Agent frameworks focus on "how does the agent call the tool?". Kaleido's
        differentiator is "how does the capability tell the agent what to do
        next?". "The process cannot continue until these facts are collected"
        is business behavior and domain metadata, not UI — a questionnaire is
        one presentation of it. Waiting for information is the most common
        non-terminal enterprise state (prior auth, claims, onboarding,
        credentialing, appeals, case management, enrollment) and should not be
        modelled as a validation error.
        Existing foundations: ExecutionDecisionType.AwaitingRequiredStep /
        AwaitingStepSelection, ProcessExecutionState.AwaitingRequiredStep,
        RequiredStep + AvailableSteps on responses, step field metadata
        (types, constraints, enums).
        Gaps: (1) no first-class "information needed" artifact — consumer must
        fetch MetadataUrl and infer questions from a CLR schema with no prompt,
        reason, or grouping; (2) no dynamic per-instance questions/options
        (e.g. "Which of these three enrollments?"); (3) PriorAuth sample works
        around it by returning QuestionnaireDefinitionView inside sample-specific
        typed responses (CaptureRequestedServiceResponse.Questionnaire,
        StartRadiologyIntakeResponse) that only its Angular UI understands;
        (4) not-yet-collected input surfaces as ValidationFailed / error
        ProcessMessages; (5) no sibling interaction states (NeedsApproval,
        NeedsHumanReview, NeedsDocument, NeedsDecision).
      recommended_fix: >
        Core (transport-agnostic): InformationRequest record — Title,
        Description, Reason, Questions (Id, Prompt, Required, data type +
        constraints via DataTypeMapper/ConstraintMapper, static or
        runtime-resolved Options, optional EnableWhen), ResponseStep,
        NextAction. Handler factory ProcessStepHandlerResult.NeedsInformation(...)
        mapping to a new AwaitingInformation decision/state value — valid
        workflow state, never an error or failure metric. Static defaults
        derived from required-step field metadata + additive prompt/reason
        attributes; dynamic per-instance overrides from handlers. Open request
        persisted on ProcessorContext (current state only) so state endpoint
        returns it on resume. Additive informationRequest field on
        ProcessExecutionResponse / StepExecutionResponse / ProcessStateResponse.
        AI-006 adapters project it directly (MCP: ask these questions, then call
        ResponseStep). Migrate PriorAuth questionnaire-in-payload to
        NeedsInformation as the reference consumer (Angular form, agent, voice
        all from the same metadata). NeedsApproval/NeedsHumanReview/etc. follow
        the same "awaiting + descriptor" pattern later — not built speculatively.
      effort: large
      breaking_change: additive
      status: PENDING_DESIGN_REVIEW
      gate: [Q-009]
      related: [AI-001, AI-002, AI-006, EXT-12]
      dependency_notes: >
        AI-001 — NextAction needs side-effect/confirmation semantics.
        AI-002 — agents retry answer submissions; idempotency matters most here.
        EXT-12 — questions/options may contain PHI; only authorized callers (and,
        with ownership on, the owner/role) may read or answer an open request.

    # ── Developer-tools / AI code-generation track ────────────────────────────
    # (originally numbered AI-001..AI-007 in REVIEW_FINDINGS.md "Developer
    # Tools" section; renumbered here to avoid collision with the agent-safety
    # findings above)

    AI-008:
      title: Dispatch order not formalized by tests
      severity: CRITICAL
      category: Developer tools / AI code-gen
      description: >
        Queryable dispatch order (delegated → local → direct) is documented
        but not proven by tests. AI copilots cannot verify correct lane
        selection — silent performance regression or logic errors if order
        drifts.
      recommended_fix: >
        Property/theory tests proving exhaustive deterministic dispatch order.
        Add "For AI-Assisted Development" callout to src/Kaleido README.
      effort: small
      breaking_change: false
      status: COMPLETED

    AI-009:
      title: .editorconfig missing C# 12+ rules
      severity: HIGH
      category: Developer tools / AI code-gen
      description: >
        .editorconfig is minimal — namespace style, naming conventions,
        primary constructors, sealed records not enforced. AI generates code
        violating team style → review friction.
      recommended_fix: >
        Expand .editorconfig with namespace style, naming, primary-constructor
        and record preferences. Ship an .editorconfig.template for consumers.
      effort: small
      breaking_change: false
      status: COMPLETED

    AI-010:
      title: XML documentation coverage gaps (60–70%)
      severity: HIGH
      category: Developer tools / AI code-gen
      description: >
        Public types lack comprehensive XML docs; AI copilots rely on
        IntelliSense and generate mismatched code without them. EXT-19 fixed
        stale/incorrect comments — this tracks remaining coverage + CI gate.
      recommended_fix: >
        Audit and complete XML docs (Tier 1: core + abstractions first).
        Add CI gate for ≥90% coverage on public surface. Add "For AI" remarks
        to key types.
      effort: medium
      breaking_change: false
      status: PENDING_DESIGN_REVIEW
      related: [EXT-19]

    AI-011:
      title: IQueryContextSource<T> sync/async confusion
      severity: MEDIUM
      category: Developer tools / AI code-gen
      description: >
        Both sync and async source interfaces are public. AI generators do not
        know which to implement → potential deadlock or mismatched semantics.
      recommended_fix: >
        Audit real usage; if sync path is rare, internalize it. Add analyzer
        guidance for misuse (proposed KAL1012 slot — verify ID against
        docs/ANALYZERS.md before assigning).
      effort: small
      breaking_change: possibly
      status: PENDING_DESIGN_REVIEW

    AI-012:
      title: Correlation context invariants undocumented
      severity: MEDIUM
      category: Developer tools / AI code-gen
      description: >
        Invariants (exactly one RequestId per request; echo-or-generate;
        propagate on outbound hops) are not formally documented. AI generates
        code that overwrites IDs, forgets propagation, or creates multiples.
      recommended_fix: >
        Add "Correlation Context Invariants" section to src/ARCHITECTURE.md.
        Propose analyzer for overwrite/propagation violations.
      effort: small
      breaking_change: false
      status: PENDING_DESIGN_REVIEW

    AI-013:
      title: Missing canonical patterns document
      severity: MEDIUM
      category: Developer tools / AI code-gen
      description: >
        Test suite has patterns but no single source of truth. AI generates
        plausible-but-wrong code when conventions live only in examples.
      recommended_fix: >
        Create docs/PATTERNS.md with canonical examples. Update extension
        points table. Add "For Code Generators" section to AGENTS.md.
      effort: medium
      breaking_change: false
      status: PENDING_DESIGN_REVIEW

    AI-014:
      title: Security/constraint analyzer rules undocumented
      severity: LOW
      category: Developer tools / AI code-gen
      description: >
        Analyzers (KAL0005–KAL0014) enforce DI/constraint rules but AI does not
        know them → generates code bypassing DI or violating constraints.
      recommended_fix: >
        Expand docs/ANALYZERS.md with a "Security-Relevant Analyzers" table.
        Add quick-fix providers where feasible.
      effort: small
      breaking_change: false
      status: PENDING_DESIGN_REVIEW

