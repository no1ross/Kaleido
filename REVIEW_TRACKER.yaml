    gate: none
    findings: [CR-005, CR-006, HP-002, HP-017, MP-019, MP-002]
  DECISION-SESSION:
    gate: "blocks PR-07..PR-10"
    findings: [Q-001, Q-002, Q-003, Q-004, Q-005, Q-006, Q-007, Q-008]
  PR-07-http-taxonomy:
