  EXT-12:
    title: "HTTP auth epic: spoofable correlation identity + auth-unaware discovery + unauthenticated fan-out"
    source: KAL-M01, KAL-M02, ai_findings AI-004
    severity: HIGH
    effort: medium
    breaking_change: true
    status: COMPLETED
    related: [EXT-07]
    resolution_note: >
      (EXT-12) Correlation identity trust: TrustCorrelationIdentity predicate
      (default: trust w/o auth infra, IsAuthenticated when auth present);
      caller name/roles stamped post-auth onto KaleidoCorrelationContext via
      endpoint filter. Discovery: [KaleidoAuthorization] metadata projected
      into RequireAuthorization per endpoint + filtered catalogs/registries;
      RequireAuthorization option guards undeclared capabilities. Ownership:
      ProcessorContext.Owner/OwnerRoles stamped at creation; resume/state gated
      by owner-or-role-mate (IKaleidoAuthorizationEvaluator in core);
      POST /processes/{id}/transfer reassigns; RequireProcessOwnership option.
      Fan-out: documented transport responsibility; PriorAuth sample
      demonstrates dev-token auth + forwarding end-to-end.
    description: >
      Three related gaps in the HTTP auth story, merged into one design:
      (a) Inbound X-Kaleido-* correlation headers are trusted as identity.
      X-Kaleido-Process-Id directly selects which process instance resumes
      (ProcessExecutionService); X-Kaleido-Source-Processor/StepName flow into
      published ProcessEventContext audit fields and Activity tags. Any caller
      that knows a GUID can resume/mutate it and poison the audit trail.
      (b) Registry/catalog endpoints expose all registered capabilities to
      every caller regardless of authorization — capability leakage raises
      security and prompt-injection surface concerns.
      (c) Registry fan-out to downstream clients is unbounded/unauthenticated.
    recommended_fix: >
      Kaleido performs no auth itself — it provides seams so the consumer's
      auth posture covers all three surfaces:
      - ICorrelationContextValidator (or trusted-source option) in Kaleido.Http,
        invoked by ObservabilityMiddleware before initializing the correlation
        context; rejection strips or 400s caller-asserted headers.
      - ICapabilityFilter consulted at discovery time, injectable from
        HttpContext claims; registry returns only permitted capabilities.
      - Document that X-Kaleido-Process-Id is a capability URL: consumers must
        RequireAuthorization on the RouteGroupBuilder (enabled by EXT-07) and
        own process-level authorization.
      - Fan-out: document downstream call auth requirements; consider an
        outbound credential/delegation hook on the client factories.
    notes: "Merged EXT-13 (fan-out auth) and AI-004 (auth-aware discovery) per owner direction."
