<nav class="main-nav">

    <div class="nav-content">

        <div class="nav-links">

            <a
                routerLink="/ecommerce/products"
                routerLinkActive="active">
                Products
            </a>

            <a
                routerLink="/ecommerce/cart"
                routerLinkActive="active">
                Cart ({{ itemCount }})
            </a>

            <a
                routerLink="/orders"
                routerLinkActive="active">
                Orders
            </a>

        </div>

        <div class="persona-selector">

            <label for="customer">
                Customer
            </label>

            <select
                id="customer"
                [value]="activeCustomerId ?? ''"
                (change)="onCustomerChanged($event)">

                <option value="">
                    Anonymous
                </option>

                @for (
                    customer of customers;
                    track customer.customerId)
                {
                    <option
                        [value]="customer.customerId">

                        {{ customer.displayName }}

                    </option>
                }

            </select>

        </div>

    </div>

</nav>
`
