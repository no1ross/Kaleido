name: Feature or work item
description: A change to make, with the done criteria written before work starts.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is missing or wrong today, with evidence (file:line, behavior, links).
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to change. Kaleido stays a mechanism; business decisions belong to the implementer (ADR 0001).
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done criteria
      description: Checkable criteria; anything outside them is a separate issue.
      value: |
        - [ ]
        - [ ] Build 0 warnings, all tests pass.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Linked issues and their relation (requires / should / separate).
