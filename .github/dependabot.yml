# Dependency updates. Every ecosystem waits 7 days after a release before proposing it (cooldown),
# matching the repository rule of only taking versions published at least a week ago.
#
# At most one PR per ecosystem per run (#383). Major NuGet versions are ignored: they are migrations
# (they can change the net8.0 runtime line, a maintainer decision - docs/VERSIONING.md), done
# deliberately through an issue. The sample UIs (npm) moved to their own repositories with the
# samples (#95).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Roslyn version Kaleido.Analyzers references is the minimum compiler a consumer needs to
      # load it: it stays at the oldest supported SDK's compiler and moves only deliberately (#387).
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.Common"
      # Pinned to 4.18.4, before SponsorLink (HP-010); lift the pin deliberately (#387).
      - dependency-name: "Moq"
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
