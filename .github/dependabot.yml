# Dependency updates. Every ecosystem waits 7 days after a release before proposing it (cooldown),
# matching the repository rule of only taking versions published at least a week ago.
#
# At most one PR per ecosystem per run (#383). Major npm and NuGet versions are ignored: they are
# migrations (Angular/TypeScript majors in the sample UIs; NuGet majors can change the net8.0
# runtime line, a maintainer decision - docs/VERSIONING.md), done deliberately through an issue.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Roslyn version Kaleido.Analyzers references is the minimum compiler a consumer needs to
      # load it: it stays at the oldest supported SDK's compiler and moves only deliberately (#387).
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.Common"
      # Pinned to 4.18.4, before SponsorLink (HP-010); lift the pin deliberately (#387).
      - dependency-name: "Moq"
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # One group for both sample UIs, so the Angular packages (which pin each other exactly) always
  # move together.
  - package-ecosystem: npm
    directories:
      - "/samples/PriorAuth/priorauth-ui"
      - "/samples/kaleido-sample-ecommerce-ui"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
