name: Dependency review

on:
  pull_request:
    branches: [master]

# A newer push to the pull request cancels the review it supersedes (#466).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Review dependencies
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      with:
        fail-on-severity: high
        # Permissive licenses only (#526): anything else - GPL, LGPL, AGPL, SSPL, BUSL... - fails the
        # review, and adding a license here is a maintainer decision.
        allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BSL-1.0, Unlicense, CC0-1.0
