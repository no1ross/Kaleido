name: Build

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

# A newer push to a pull request cancels the run it supersedes; runs on master always finish, so
# every merged commit is analyzed, tested and packed (#466).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    # SonarQube Cloud (CI-based analysis). The Sonar steps run only when the token is available, so
    # pull requests from forks or Dependabot (no secrets) still build and test.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Check text encoding
      shell: python3 {0}
      run: |
        import re, subprocess, sys
        corruption = re.compile("\ufffd|\u00e2\u20ac|\u00c3[\u0080-\u00bf]|\u00c2[\u0080-\u00bf]|\u0393\u00c7")
        extensions = (".cs", ".md", ".txt", ".json", ".yml", ".yaml", ".xml", ".props", ".targets", ".csproj",
                      ".slnx", ".editorconfig", ".http", ".ts", ".html", ".scss", ".css", ".razor", ".ps1", ".cmd", ".sh")
        files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode("utf-8").split("\0")
        findings = 0
        for path in (f for f in files if f.lower().endswith(extensions)):
            try:
                with open(path, encoding="utf-8") as handle:
                    lines = handle.read().splitlines()
            except UnicodeDecodeError:
                print(f"::error file={path}::Not valid UTF-8.")
                findings += 1
                continue
            for number, line in enumerate(lines, 1):
                if corruption.search(line):
                    print(f"::error file={path},line={number}::U+FFFD or mojibake (UTF-8 decoded as another code page).")
                    findings += 1
        sys.exit(1 if findings else 0)

    # Every Kaleido type or member named in the docs must exist in the sources (ADRs are historical
    # and skipped).
    - name: Check documentation symbols
      run: python3 tools/docs/check-doc-symbols.py

    # Every C# example in the consumer guide equals a compiled region of docs/guide/examples (#409).
    - name: Check guide snippets
      run: python3 tools/docs/check-guide-snippets.py

    # Every AGENTS.md stays small enough for agent tooling to load it whole (#455).
    - name: Check AGENTS.md size
      run: python3 tools/docs/check-agents-size.py

    # The SDK from global.json builds; the .NET 8 runtime is installed too, because the packages
    # target net8.0 and the tests must run on the runtime consumers use (docs/VERSIONING.md).
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    # Whitespace and final newlines as .editorconfig states them (#462). The build enforces code style
    # but not these. Folder mode: no MSBuild load (seconds), and every C# file in src, tools, tests and
    # the guide's examples is checked, whatever project it belongs to.
    - name: Check whitespace
      run: dotnet format whitespace --folder --include src/ tools/ tests/ docs/ --exclude '**/obj/**' '**/bin/**' --verify-no-changes

    - name: Restore
      run: dotnet restore Kaleido.slnx

    # The test gate's own decisions (#437): a missing summary, zero tests, an incomplete project set
    # and a stale build output each fail Run-Tests.ps1. Before Sonar begins: it builds a probe project.
    - name: Self-test the test gate
      shell: pwsh
      run: ./tools/test/Test-RunTests.ps1

    - name: Set up Java (Sonar scanner)
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
      with:
        distribution: temurin
        java-version: '17'

    # Analysis scope: C# in src, tools and the consumer guide's examples (tests are test code, generated
    # obj/ excluded). The samples live in their own repositories (#95); the guide's compiled examples
    # (docs/guide/examples) are the task-focused examples here.
    # Coverage is measured on src and the guide's examples (tools and tests excluded). The quality gate
    # is the project's SonarCloud gate "Kaleido Default" (95% coverage on new code, no new rating
    # regressions, duplication at most 2.5%, every hotspot reviewed); the end step waits for it and fails
    # the build when it fails (#490).
    # The .NET analyzers' findings (Meziantou, Roslynator, CA, IDE) are imported into Sonar, including
    # suggestion-level ones: every finding is visible and fixed, and each fixed rule becomes a warning
    # in .editorconfig (which fails the build). A rule that is off is 'none' there, with the reason.
    - name: Sonar begin
      if: ${{ env.SONAR_TOKEN != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 11.3.0
        dotnet sonarscanner begin \
          /k:"no1ross_Kaleido" \
          /o:"no1ross" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.coverageReportPaths="coverage/SonarQube.xml" \
          /d:sonar.coverage.exclusions="tools/**,tests/**" \
          /d:sonar.exclusions="**/obj/**,**/bin/**" \
          /d:sonar.qualitygate.wait=true

    - name: Build
      run: dotnet build Kaleido.slnx --configuration Release --no-restore

    # xunit.v3 runs under Microsoft.Testing.Platform (UseMicrosoftTestingPlatformRunner); coverage
    # uses the MTP extension (Microsoft.Testing.Extensions.CodeCoverage in tests/Directory.Build.props).
    # The .NET 9 SDK's dotnet test cannot run MTP v2, so the script runs each test project directly
    # and writes the cobertura files to TestResults/ (#424).
    - name: Test
      shell: pwsh
      run: ./tools/test/Run-Tests.ps1 -Configuration Release -Coverage

    # Merge per-project cobertura into a union report. Summing hits across files
    # would double-count shared src assemblies; reportgenerator merges hits.
    # Scope is shipped src/ assemblies only - tests and analyzers (tools/) are excluded by
    # assembly. Not by path: reportgenerator's file filters are case-insensitive, and '*/tools/*' also
    # matched src/Kaleido.Http.Mcp/Tools/ (#260).
    - name: Merge coverage
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
        reportgenerator \
          "-reports:TestResults/*.cobertura.xml" \
          "-targetdir:coverage" \
          "-reporttypes:lcov;HtmlSummary;SonarQube;MarkdownSummaryGithub" \
          "-assemblyfilters:-*Tests*;-*FunctionalTests*;-*IntegrationTests*;-Kaleido.Analyzers*"
        # The coverage table on the run's page (#490); the files themselves are uploaded below.
        cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Sonar end (upload, quality gate)
      if: ${{ env.SONAR_TOKEN != '' }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # ENFORCED: merged line coverage of the shipped src/ assemblies must meet the floor, or the build
    # fails. Ratchet: raise, never lower (99.8% when the gate was enforced).
    - name: Coverage gate
      run: |
        lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' coverage/lcov.info)
        lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' coverage/lcov.info)
        if [ "$lf" -eq 0 ]; then
          echo "::error::No coverable lines found in coverage/lcov.info."
          exit 1
        fi
        rate=$(awk "BEGIN{printf \"%.1f\", $lh*100.0/$lf}")
        echo "Merged line coverage: $rate% ($lh/$lf) - floor: $COVERAGE_FLOOR%"
        if awk "BEGIN{exit !($rate+0 >= $COVERAGE_FLOOR)}"; then
          echo "Coverage meets the $COVERAGE_FLOOR% floor."
        else
          echo "::error::Merged line coverage $rate% is below the $COVERAGE_FLOOR% floor."
          exit 1
        fi
      env:
        COVERAGE_FLOOR: 95

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage
        path: |
          TestResults/*.cobertura.xml
          coverage/lcov.info
          coverage/index.html
          coverage/SummaryGithub.md
        if-no-files-found: ignore
        retention-days: 14

    # Pack shipped src/ projects and the consumer analyzer on PRs and master
    # merges; master uploads artifacts. Publishing is the release workflow's (release.yml, RELEASING.md).
    - name: Pack
      run: |
        for project in src/*/*.csproj tools/analyzers/Kaleido.Analyzers/Kaleido.Analyzers.csproj; do
          dotnet pack "$project" --configuration Release --no-build -o artifacts
        done

    # The packages as a consumer gets them (#319, #436): exactly the release set (manifest of ids,
    # one version, a symbols package per library), contents and metadata, analyzer isolation read from
    # the restored assets, a clean core consumer (no repository-only rule; KAL2001 on a violation)
    # and a clean host consumer of every runtime package that starts and answers.
    - name: Test packages in a clean consumer
      shell: pwsh
      run: ./tools/packaging/Test-PackageConsumer.ps1 -Packages artifacts -RequireDeterministic

    # The package gate's own self-test: each package removed, a duplicate, mixed versions, an
    # unexpected id, a symbols package without its PDB and a leaked analyzer each fail it.
    - name: Self-test the package gate
      shell: pwsh
      run: ./tools/packaging/Test-PackageConsumer.Tests.ps1 -Packages artifacts

    - name: Upload packages
      if: github.event_name == 'push'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: packages
        path: artifacts/*.nupkg
        if-no-files-found: error
        retention-days: 30

  # The maintainer develops on Windows: build and test there too, so path, line-ending and shell
  # differences surface on master instead of on a contributor's machine (#466). Not on pull requests,
  # to keep their checks fast; run it by hand (workflow_dispatch) before merging a risky change.
  build-windows:

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore Kaleido.slnx

    - name: Self-test the test gate
      shell: pwsh
      run: ./tools/test/Test-RunTests.ps1

    - name: Build
      run: dotnet build Kaleido.slnx --configuration Release --no-restore

    - name: Test
      shell: pwsh
      run: ./tools/test/Run-Tests.ps1 -Configuration Release
