name: Build

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    # SonarQube Cloud (CI-based analysis). The Sonar steps run only when the token is available, so
    # pull requests from forks or Dependabot (no secrets) still build and test.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore --locked-mode

    - name: Set up Java (Sonar scanner)
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # Analysis scope: C# in src and tools (tests are test code, generated obj/ excluded). samples/ is
    # excluded for now: the full sample implementations move to their own repositories before release
    # (#250); the slim examples that replace them are analyzed again (remove samples/** below).
    # Coverage is measured on src only, like the coverage report below. The quality gate (zero new
    # issues, 90% coverage on new code) is evaluated by the end step, which fails the build.
    # .editorconfig is the single source of truth for the .NET analyzers (Meziantou, Roslynator, CA,
    # IDE): rules at warning or above already fail the build, rules set to suggestion are deliberate.
    # Sonar does not re-judge them (roslyn.ignoreIssues); it reports its own rules on top.
    - name: Sonar begin
      if: ${{ env.SONAR_TOKEN != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 11.3.0
        dotnet sonarscanner begin \
          /k:"no1ross_Kaleido" \
          /o:"no1ross" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.coverageReportPaths="coverage/SonarQube.xml" \
          /d:sonar.coverage.exclusions="samples/**,tools/**,tests/**" \
          /d:sonar.exclusions="**/obj/**,**/bin/**,samples/**" \
          /d:sonar.cs.roslyn.ignoreIssues=true \
          /d:sonar.qualitygate.wait=true

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # xunit.v3 runs under Microsoft.Testing.Platform (global.json test.runner);
    # VSTest collectors are ignored there, so coverage uses the MTP extension
    # (Microsoft.Testing.Extensions.CodeCoverage in tests/Directory.Build.props).
    - name: Test
      run: dotnet test --configuration Release --no-build -- --coverage --coverage-output-format cobertura

    # Merge per-project cobertura into a union report. Summing hits across files
    # would double-count shared src assemblies; reportgenerator merges hits.
    # Scope is shipped src/ assemblies only - tests/, tools/, samples/ excluded.
    - name: Merge coverage
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator \
          "-reports:TestResults/*.cobertura.xml" \
          "-targetdir:coverage" \
          "-reporttypes:lcov;HtmlSummary;SonarQube" \
          "-assemblyfilters:-*Tests*;-*FunctionalTests*;-*IntegrationTests*" \
          "-filefilters:-*/tests/*;-*/tools/*;-*/samples/*"

    - name: Sonar end (upload, quality gate)
      if: ${{ env.SONAR_TOKEN != '' }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # ADVISORY: reports merged line coverage vs the 90% target and emits a
    # warning annotation. Not enforced yet - flip continue-on-error to hard-gate
    # once coverage is sustained above the floor. Ratchet: raise, never lower.
    - name: Coverage gate (advisory)
      continue-on-error: true
      run: |
        lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' coverage/lcov.info)
        lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' coverage/lcov.info)
        rate=$(awk "BEGIN{r=0; if ($lf>0) r=$lh*100.0/$lf; printf \"%.1f\", r}")
        echo "Merged line coverage: $rate% ($lh/$lf) - target: $COVERAGE_FLOOR%"
        if awk "BEGIN{exit !($rate+0 >= $COVERAGE_FLOOR)}"; then
          echo "Coverage meets the $COVERAGE_FLOOR% target."
        else
          echo "::warning::Merged line coverage $rate% is below the $COVERAGE_FLOOR% target."
          exit 1
        fi
      env:
        COVERAGE_FLOOR: 90

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          TestResults/*.cobertura.xml
          coverage/lcov.info
          coverage/index.html
        if-no-files-found: ignore

    # Pack shipped src/ projects on PRs and master merges; master uploads
    # artifacts. NuGet publish is deliberately not wired up.
    - name: Pack
      run: |
        for project in src/*/*.csproj; do
          dotnet pack "$project" --configuration Release --no-build -o artifacts
        done
        packages=(artifacts/*.nupkg)
        test "${#packages[@]}" -eq 7
        unzip -Z1 artifacts/Kaleido.[0-9]*.nupkg |
          awk '$0 == "analyzers/dotnet/cs/Kaleido.Analyzers.dll" { found=1 } END { exit !found }'

    - name: Upload packages
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/*.nupkg
        if-no-files-found: error

