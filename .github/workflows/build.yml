name: Build

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    # SonarQube Cloud (CI-based analysis). The Sonar steps run only when the token is available, so
    # pull requests from forks or Dependabot (no secrets) still build and test.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Check text encoding
      shell: python3 {0}
      run: |
        import re, subprocess, sys
        corruption = re.compile("\ufffd|\u00e2\u20ac|\u00c3[\u0080-\u00bf]|\u00c2[\u0080-\u00bf]|\u0393\u00c7")
        extensions = (".cs", ".md", ".txt", ".json", ".yml", ".yaml", ".xml", ".props", ".targets", ".csproj",
                      ".slnx", ".editorconfig", ".http", ".ts", ".html", ".scss", ".css", ".razor", ".ps1", ".cmd", ".sh")
        files = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode("utf-8").split("\0")
        findings = 0
        for path in (f for f in files if f.lower().endswith(extensions)):
            try:
                with open(path, encoding="utf-8") as handle:
                    lines = handle.read().splitlines()
            except UnicodeDecodeError:
                print(f"::error file={path}::Not valid UTF-8.")
                findings += 1
                continue
            for number, line in enumerate(lines, 1):
                if corruption.search(line):
                    print(f"::error file={path},line={number}::U+FFFD or mojibake (UTF-8 decoded as another code page).")
                    findings += 1
        sys.exit(1 if findings else 0)

    # Every Kaleido type or member named in the docs must exist in the sources (ADRs and audit
    # records are historical and skipped).
    - name: Check documentation symbols
      run: python3 tools/docs/check-doc-symbols.py

    # The SDK from global.json builds; the .NET 8 runtime is installed too, because the packages
    # target net8.0 and the tests must run on the runtime consumers use (docs/VERSIONING.md).
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Set up Java (Sonar scanner)
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    # Analysis scope: C# in src and tools (tests are test code, generated obj/ excluded). samples/ is
    # excluded for now: the full sample implementations move to their own repositories before release
    # (#250); the slim examples that replace them are analyzed again (remove samples/** below).
    # Coverage is measured on src only, like the coverage report below. The quality gate (zero new
    # issues, 90% coverage on new code) is evaluated by the end step, which fails the build.
    # The .NET analyzers' findings (Meziantou, Roslynator, CA, IDE) are imported into Sonar, including
    # suggestion-level ones: every finding is visible and fixed, and each fixed rule becomes a warning
    # in .editorconfig (which fails the build). A rule that is off is 'none' there, with the reason.
    - name: Sonar begin
      if: ${{ env.SONAR_TOKEN != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 11.3.0
        dotnet sonarscanner begin \
          /k:"no1ross_Kaleido" \
          /o:"no1ross" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.coverageReportPaths="coverage/SonarQube.xml" \
          /d:sonar.coverage.exclusions="samples/**,tools/**,tests/**" \
          /d:sonar.exclusions="**/obj/**,**/bin/**,samples/**" \
          /d:sonar.qualitygate.wait=true

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # xunit.v3 runs under Microsoft.Testing.Platform (global.json test.runner);
    # VSTest collectors are ignored there, so coverage uses the MTP extension
    # (Microsoft.Testing.Extensions.CodeCoverage in tests/Directory.Build.props).
    - name: Test
      run: dotnet test --configuration Release --no-build -- --coverage --coverage-output-format cobertura

    # Merge per-project cobertura into a union report. Summing hits across files
    # would double-count shared src assemblies; reportgenerator merges hits.
    # Scope is shipped src/ assemblies only - tests, analyzers (tools/) and samples are excluded by
    # assembly. Not by path: reportgenerator's file filters are case-insensitive, and '*/tools/*' also
    # matched src/Kaleido.Http.Mcp/Tools/ (#260).
    - name: Merge coverage
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
        reportgenerator \
          "-reports:TestResults/*.cobertura.xml" \
          "-targetdir:coverage" \
          "-reporttypes:lcov;HtmlSummary;SonarQube" \
          "-assemblyfilters:-*Tests*;-*FunctionalTests*;-*IntegrationTests*;-Kaleido.Analyzers*;-Kaleido.Samples*"

    - name: Sonar end (upload, quality gate)
      if: ${{ env.SONAR_TOKEN != '' }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # ENFORCED: merged line coverage of the shipped src/ assemblies must meet the floor, or the build
    # fails. Ratchet: raise, never lower (99.8% when the gate was enforced).
    - name: Coverage gate
      run: |
        lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' coverage/lcov.info)
        lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' coverage/lcov.info)
        if [ "$lf" -eq 0 ]; then
          echo "::error::No coverable lines found in coverage/lcov.info."
          exit 1
        fi
        rate=$(awk "BEGIN{printf \"%.1f\", $lh*100.0/$lf}")
        echo "Merged line coverage: $rate% ($lh/$lf) - floor: $COVERAGE_FLOOR%"
        if awk "BEGIN{exit !($rate+0 >= $COVERAGE_FLOOR)}"; then
          echo "Coverage meets the $COVERAGE_FLOOR% floor."
        else
          echo "::error::Merged line coverage $rate% is below the $COVERAGE_FLOOR% floor."
          exit 1
        fi
      env:
        COVERAGE_FLOOR: 95

    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage
        path: |
          TestResults/*.cobertura.xml
          coverage/lcov.info
          coverage/index.html
        if-no-files-found: ignore

    # Pack shipped src/ projects and the consumer analyzer on PRs and master
    # merges; master uploads artifacts. NuGet publish is deliberately not wired up.
    - name: Pack
      run: |
        for project in src/*/*.csproj tools/analyzers/Kaleido.Analyzers/Kaleido.Analyzers.csproj; do
          dotnet pack "$project" --configuration Release --no-build -o artifacts
        done
        packages=(artifacts/*.nupkg)
        test "${#packages[@]}" -eq 8
        unzip -Z1 artifacts/Kaleido.Analyzers.[0-9]*.nupkg |
          awk '$0 == "analyzers/dotnet/cs/Kaleido.Analyzers.dll" { found=1 } END { exit !found }'
        unzip -p artifacts/Kaleido.[0-9]*.nupkg Kaleido.nuspec |
          grep -q '<dependency id="Kaleido.Analyzers"'

    - name: Upload packages
      if: github.event_name == 'push'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: packages
        path: artifacts/*.nupkg
        if-no-files-found: error

