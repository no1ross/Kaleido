name: Release

# Builds, tests, packs and verifies the packages from a clean checkout, attests their provenance, then
# publishes them (RELEASING.md, #318, #432).
# - A tag v<version> on master publishes that version to the repository's GitHub Packages feed and to
#   nuget.org (trusted publishing, no stored API key); the tag must equal the version Nerdbank
#   computes from version.json (set the version in version.json first, then tag that commit), and
#   a GitHub Release is created with the packages and symbols attached.
# - workflow_dispatch is the dry run: the current master's preview version, published to the GitHub
#   Packages feed only, without a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Releases run one at a time and are never cancelled midway (a publish may have started) (#466).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:

    runs-on: ubuntu-latest

    # Publishing waits for this environment's protection rules (required reviewers) - configure
    # them in the repository settings; RELEASING.md lists the expected setup.
    environment: release

    permissions:
      contents: write      # the GitHub Release on a tag
      packages: write      # GitHub Packages
      id-token: write      # OIDC: nuget.org trusted publishing and the build attestation
      attestations: write  # the build provenance attestation

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore Kaleido.slnx

    - name: Build
      run: dotnet build Kaleido.slnx --configuration Release --no-restore

    - name: Test
      shell: pwsh
      run: ./tools/test/Run-Tests.ps1 -Configuration Release

    - name: Pack
      run: |
        for project in src/*/*.csproj tools/analyzers/Kaleido.Analyzers/Kaleido.Analyzers.csproj; do
          dotnet pack "$project" --configuration Release --no-build -o artifacts
        done

    # The complete release set (its manifest: ids, one version, symbols), contents and metadata, and
    # clean consumers of every package (#436).
    - name: Verify the packages
      shell: pwsh
      run: ./tools/packaging/Test-PackageConsumer.ps1 -Packages artifacts -RequireDeterministic

    # A tag publishes exactly the version it names: refuse a tag that does not match version.json.
    - name: Check the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version="${GITHUB_REF_NAME#v}"
        test -f "artifacts/Kaleido.${version}.nupkg" || {
          echo "::error::Tag ${GITHUB_REF_NAME} does not match the packed version ($(ls artifacts/Kaleido.[0-9]*.nupkg)). Set the version in version.json, then tag that commit."
          exit 1
        }

    # A tag also publishes to nuget.org, which needs the owner setup in RELEASING.md (a trusted
    # publishing policy on nuget.org and the NUGET_USER repository variable): checked before anything
    # is published, so a misconfigured tag publishes nowhere.
    - name: Check the nuget.org publisher is configured
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        test -n "$NUGET_USER" || {
          echo "::error::The NUGET_USER repository variable is not set: a tag publishes to nuget.org. See RELEASING.md (Owner setup)."
          exit 1
        }

    # A signed SLSA build provenance attestation for every package: verify a downloaded package with
    # `gh attestation verify <file>.nupkg --repo no1ross/Kaleido` (RELEASING.md).
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-path: artifacts/*.nupkg

    # GitHub Packages hosts the .nupkg files; it does not host symbol packages, so the .snupkg files
    # travel with the workflow run (and with the GitHub Release on a tag).
    # The token reaches the script as an environment variable, never expanded into it (Sonar S7636).
    - name: Publish to GitHub Packages
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet nuget push "artifacts/*.nupkg" \
          --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
          --api-key "$GITHUB_PACKAGES_TOKEN" \
          --skip-duplicate

    # nuget.org, on a tag only, with trusted publishing: NuGet/login exchanges the run's OIDC token for
    # a short-lived API key, so no publication secret is stored (the publisher check above runs first).
    - name: Log in to nuget.org
      id: nuget-login
      if: startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    # nuget.org also takes the .snupkg next to each .nupkg (its symbol server).
    - name: Publish to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "artifacts/*.nupkg" \
          --source "https://api.nuget.org/v3/index.json" \
          --api-key "$NUGET_API_KEY" \
          --skip-duplicate

    - name: Upload packages and symbols
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: release-packages
        path: |
          artifacts/*.nupkg
          artifacts/*.snupkg
        if-no-files-found: error
        retention-days: 90

    - name: Create the GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        prerelease=""
        case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
        gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg artifacts/*.snupkg \
          --title "${GITHUB_REF_NAME}" \
          --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed." \
          ${prerelease}
