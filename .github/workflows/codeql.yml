name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    # A real build gives CodeQL full type information (build-mode none produced false positives). Only
    # what ships is built - src, tools, samples - so test code and the xUnit-generated entry points are
    # never analyzed (paths-ignore cannot filter a full build of a compiled language).
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        build-mode: manual
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Restore
      run: dotnet restore --locked-mode

    - name: Build what ships (src, tools, samples)
      run: |
        dotnet new sln --name CodeQL --format sln --output "$RUNNER_TEMP"
        git ls-files '*.csproj' | grep -E '^(src|tools|samples)/' |
          xargs dotnet sln "$RUNNER_TEMP/CodeQL.sln" add
        dotnet build "$RUNNER_TEMP/CodeQL.sln" --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"
