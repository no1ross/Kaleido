name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

# A newer push to a pull request cancels the run it supersedes; runs on master always finish (#466).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # NBGV needs full history for version height

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: global.json

    # A real build gives CodeQL full type information (build-mode none produced false positives). Only
    # what ships is built - src and tools - so test code and the xUnit-generated entry points are never
    # analyzed (paths-ignore cannot filter a full build of a compiled language). The samples live in
    # their own repositories (#95).
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      with:
        languages: csharp
        build-mode: manual
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Restore
      run: dotnet restore Kaleido.slnx

    - name: Build what ships (src, tools)
      run: |
        dotnet new sln --name CodeQL --format sln --output "$RUNNER_TEMP"
        git ls-files '*.csproj' | grep -E '^(src|tools)/' |
          xargs dotnet sln "$RUNNER_TEMP/CodeQL.sln" add
        dotnet build "$RUNNER_TEMP/CodeQL.sln" --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
      with:
        category: "/language:csharp"
