name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    # build-mode none: CodeQL reads the C# sources directly - no restore/build (the Build workflow
    # builds), no generated obj/ output, and paths-ignore in the config applies (it does not when a
    # full build is analyzed).
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        build-mode: none
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"
