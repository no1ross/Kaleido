name: Security scans

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  devskim:
    name: DevSkim
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Run DevSkim
      uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221  # v1 (2026-09-29)
      with:
        directory-to-scan: .
        sarif-output-directory: sarif
        ignore-filters: |
          */bin/*,*/obj/*,*/node_modules/*,*/dist/*,*/data/*,*packages.lock.json

    - name: Upload SARIF
      if: ${{ hashFiles('sarif/*.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      with:
        sarif_file: sarif
