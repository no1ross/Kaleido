name: Security scans

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to a pull request cancels the run it supersedes; runs on master always finish (#466).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  devskim:
    name: DevSkim
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Run DevSkim
      uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221  # v1 (2026-09-29)
      with:
        directory-to-scan: .
        sarif-output-directory: sarif
        ignore-filters: |
          */bin/*,*/obj/*,*/node_modules/*,*/dist/*,*/data/*,*packages.lock.json

    - name: Upload SARIF
      if: ${{ hashFiles('sarif/*.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      with:
        sarif_file: sarif
